name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: quantumco
          POSTGRES_PASSWORD: quantumco
          POSTGRES_DB: quantumco_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantumco -d quantumco_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      QC_TEST_DATABASE_URL: postgresql://quantumco:quantumco@localhost:5432/quantumco_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: mypy
        run: uv run mypy
      - name: arquitetura (import-linter)
        run: uv run lint-imports
      - name: testes
        run: uv run pytest
      - name: testes com PostGIS
        run: uv run pytest -m db

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.28.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
