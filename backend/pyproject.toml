[project]
name = "quantumco"
version = "0.1.0"
description = "Mapa sintático (sintaxe espacial) aberto de Brusque-SC"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "shapely>=2.0",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "pyproj>=3.6",
    "geopandas>=1.0",
    "pyarrow>=17",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cityseer>=5.8,<6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "argon2-cffi>=23.1",
]

[project.scripts]
quantumco = "quantumco.entrypoints.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "types-PyYAML",
    "types-networkx",
    "types-shapely",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantumco"]

# ---------------------------------------------------------------- qualidade

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT"]
ignore = ["PLR2004", "PLR0913", "PLR0911", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["quantumco"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "pyproj.*", "pyarrow.*", "cityseer.*", "pandas.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: precisa de acesso à internet (Overpass); fora do CI de PR",
    "db: precisa de PostGIS (QC_TEST_DATABASE_URL); roda no CI com um container",
]
addopts = "-m 'not network'"

# ---------------------------------------------------------------- arquitetura (Q38, Q39, Q49, Q50)

[tool.importlinter]
root_package = "quantumco"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contextos delimitados não importam uns aos outros"
type = "independence"
modules = [
    "quantumco.road_network",
    "quantumco.syntax_analysis",
    "quantumco.releases",
    "quantumco.scenarios",
    "quantumco.location_report",
    "quantumco.identity",
    "quantumco.territory",
]

[[tool.importlinter.contracts]]
name = "Camadas territoriais: camadas hexagonais"
type = "layers"
layers = [
    "quantumco.territory.infrastructure",
    "quantumco.territory.application",
    "quantumco.territory.domain",
]

[[tool.importlinter.contracts]]
name = "Rede Viária: camadas hexagonais"
type = "layers"
layers = [
    "quantumco.road_network.infrastructure",
    "quantumco.road_network.application",
    "quantumco.road_network.domain",
]

[[tool.importlinter.contracts]]
name = "Identidade: camadas hexagonais"
type = "layers"
layers = [
    "quantumco.identity.infrastructure",
    "quantumco.identity.application",
    "quantumco.identity.domain",
]

[[tool.importlinter.contracts]]
name = "Análise Sintática: camadas hexagonais"
type = "layers"
layers = [
    "quantumco.syntax_analysis.infrastructure",
    "quantumco.syntax_analysis.application",
    "quantumco.syntax_analysis.domain",
]

[[tool.importlinter.contracts]]
name = "Cenários do usuário: camadas hexagonais"
type = "layers"
layers = [
    "quantumco.scenarios.infrastructure",
    "quantumco.scenarios.application",
    "quantumco.scenarios.domain",
]

[[tool.importlinter.contracts]]
name = "Shared kernel não depende de nenhum contexto"
type = "forbidden"
source_modules = ["quantumco.shared_kernel"]
forbidden_modules = [
    "quantumco.road_network",
    "quantumco.syntax_analysis",
    "quantumco.releases",
    "quantumco.scenarios",
    "quantumco.location_report",
    "quantumco.identity",
    "quantumco.territory",
    "quantumco.entrypoints",
    "quantumco.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Domínio e aplicação sem I/O nem frameworks (Q39)"
type = "forbidden"
source_modules = [
    "quantumco.shared_kernel",
    "quantumco.road_network.domain",
    "quantumco.road_network.application",
    "quantumco.identity.domain",
    "quantumco.identity.application",
    "quantumco.syntax_analysis.domain",
    "quantumco.syntax_analysis.application",
    "quantumco.scenarios.domain",
    "quantumco.scenarios.application",
    "quantumco.territory.domain",
    "quantumco.territory.application",
]
forbidden_modules = [
    "geopandas",
    "pyproj",
    "pyarrow",
    "httpx",
    "typer",
    "yaml",
    "fastapi",
    "starlette",
    "uvicorn",
    "cityseer",
    "pandas",
    "psycopg",
    "psycopg_pool",
    "quantumco.platform",
    "argon2",
]
