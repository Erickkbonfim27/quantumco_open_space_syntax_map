# Serviços "backend" (FastAPI + CLI de cold start) e "worker" (fila dos cenários) no Easypanel.
#   Origem: GitHub, build path "/backend" (a pasta é autocontida: código + methodology/).
#   Builder: Nixpacks. Porta interna: 8000. Dados: só no PostGIS (QC_DATABASE_URL).
#   Cold start, uma vez, no console do serviço:  /app/.venv/bin/quantumco coldstart
#
# Sem bloco [variables]: o Easypanel monta os ARGs do build só com as variáveis dele, e as
# definidas aqui chegavam vazias (ex.: UV_LINK_MODE=""). Tudo vai explícito nos comandos.

providers = []  # sem detecção automática: tudo está declarado aqui

[phases.setup]
# nixpkgs fixado (nixos-26.05, 2026-11-02): o padrão do Nixpacks 1.41 é antigo
nixpkgsArchive = "7dcdd87373d72e7a2173e4db02e20d3d7f495cfd"
nixPkgs = ["python313"]
# wheels manylinux (numpy, shapely, pyogrio, pyproj, cityseer) precisam destas libs
nixLibs = ["zlib", "stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  # uv fixado na mesma versão que gerou o uv.lock
  "python3.13 -m venv /opt/uv && /opt/uv/bin/pip install --no-cache-dir uv==0.13.6",
  "env -u UV_LINK_MODE -u UV_COMPILE_BYTECODE UV_PROJECT_ENVIRONMENT=/app/.venv UV_PYTHON_DOWNLOADS=never /opt/uv/bin/uv sync --frozen --no-dev --python python3.13 --link-mode copy --compile-bytecode",
]

[start]
# QC_ROLE=worker no serviço "worker" (mesma build): consome a fila de cálculo dos cenários.
# QC_ROLE=worker-dados no serviço "worker-dados": fila 'dados' (cargas nacionais, docs/adr/0001).
# Sem QC_ROLE (ou api): a API HTTP.
cmd = "case \"${QC_ROLE:-api}\" in worker) exec env PYTHONUNBUFFERED=1 /app/.venv/bin/quantumco worker ;; worker-dados) exec env PYTHONUNBUFFERED=1 /app/.venv/bin/quantumco worker --fila dados ;; *) exec env PYTHONUNBUFFERED=1 /app/.venv/bin/uvicorn quantumco.entrypoints.api.app:create_app --factory --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips '*' ;; esac"
