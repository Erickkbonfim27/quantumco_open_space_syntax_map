<!doctype html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>$subject</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=Outfit:wght@200;300;400;500&amp;display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; supported-color-schemes: dark; }
  body { margin: 0; padding: 0; background: #050607; -webkit-text-size-adjust: 100%; }
  a { color: #3B8CFF; }
  @media (max-width: 620px) {
    .qc-card { padding: 30px 22px !important; border-radius: 16px !important; }
    .qc-title { font-size: 24px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#050607;">
<div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;font-size:1px;line-height:1px;color:#050607;">$preheader&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#050607" style="background:#050607;">
  <tr>
    <td align="center" style="padding:40px 16px 48px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
        <tr>
          <td style="padding:0 6px 22px 6px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="10" height="10" bgcolor="#2BD46B" style="width:10px;height:10px;background:#2BD46B;border-radius:5px;font-size:0;line-height:0;">&nbsp;</td>
                <td style="padding-left:12px;font-family:'Outfit','Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400;letter-spacing:6px;color:#F4F6F5;">QUANTUMCO</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td class="qc-card" bgcolor="#0F1213" style="background:#0F1213;border:1px solid #1E2427;border-radius:20px;padding:40px 38px 36px 38px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 22px 0;">
              <tr>
                <td width="28" height="2" bgcolor="#2BD46B" style="width:28px;height:2px;background:#2BD46B;font-size:0;line-height:0;">&nbsp;</td>
                <td width="20" height="2" bgcolor="#3B8CFF" style="width:20px;height:2px;background:#3B8CFF;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
            <p style="margin:0 0 14px 0;font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:400;letter-spacing:2.2px;text-transform:uppercase;color:#9BA3A6;">$label</p>
            <h1 class="qc-title" style="margin:0 0 18px 0;font-family:'Outfit','Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;font-weight:300;line-height:1.25;color:#F4F6F5;">$title</h1>
            $body
            $action
            $note
          </td>
        </tr>
        <tr>
          <td style="padding:26px 6px 0 6px;font-family:'Outfit','Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:300;line-height:1.7;color:#6E777A;">
            $footer<br>
            Sintaxe espacial de Brusque &middot; <a href="https://quantumco.com.br" target="_blank" style="color:#9BA3A6;text-decoration:none;">quantumco.com.br</a><br>
            <span style="font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.6px;color:#4A5155;">E-MAIL AUTOMÁTICO &middot; NÃO É PRECISO RESPONDER</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
